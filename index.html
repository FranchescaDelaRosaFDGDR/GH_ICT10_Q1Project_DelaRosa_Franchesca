<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Project</title>
    <style>
    nav {
        background-color: #bfedef;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 20px;
    }

    nav a {
        color: #093032;
        text-decoration: none;
    }

    nav a:hover {
        text-decoration: underline;
    }
    .page {
            min-height: calc(100vh - 58px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
        }

        .sku-card {
            width: 430px;
            max-width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .header {
            background: #bfedef;
            color: #093032;
            text-align: center;
            padding: 22px;
        }

        .header .icon {
            font-size: 24px;
        }

        .header h1 {
            margin: 5px 0 0;
            font-size: 20px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 11px;
        }
        .content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            padding: 2%;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background: white;
            font-size: 12px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #1769ff;
            box-shadow: 0 0 4px rgba(23, 105, 255, 0.25);
        }
        .generate-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 5px;
            background: #bfedef;
            color: #093032;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            opacity: 0.9;
        }

        .output {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 18px;
            text-align: center;
        }

        .output-title {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
        }

        #sku-result {
            font-size: 24px;
            font-weight: bold;
            color: #093032;
            letter-spacing: 3px;
            min-height: 30px;
        }

        .details {
            margin-top: 12px;
            font-size: 11px;
            color: #666;
            line-height: 1.6;
        }

        .error {
            color: #d32f2f;
            font-size: 11px;
        }
        footer {
            text-align: center;
            background-color: #093032;
            color: white;
            padding: 10px;
            font-size: 10px;
        }
</style>
</head>
<body>
    <nav>
    <a href="index.html">
        <img src="Projlogo2.png" alt="Logo" height="60">
    </a>
    <a href="index.html">SKU Generator</a>
    <a href="receipt.html">Receipt Generator</a>
</nav>
    <main class="page">
        <div class="sku-card">
            <div class="header">
                <h1>SKU Generator</h1>
                <p>
                    Enter/Choose the following details to create a unique code:
                </p>
            </div>
            <div class="content">
                <div class="form-group">
                    <label for="category">
                        Category
                    </label>
                    <select id="category">
                        <option value="">
                            Select category
                        </option>

                        <option value="BEV">
                            Beverages
                        </option>

                        <option value="FOOD">
                            Food
                        </option>

                        <option value="SNK">
                            Snacks
                        </option>

                        <option value="MER">
                            Merchandise
                        </option>

                        <option value="OTH">
                            Other
                        </option>

                    </select>
                </div>
                <div class="form-group">
                    <label for="product-name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        placeholder="e.g. Coffee">
                </div>
                <div class="form-group">
                    <label for="stock-quantity">
                        Stock Quantity
                    </label>
                    <input
                        type="number"
                        id="stock-quantity"
                        min="1"
                        placeholder="e.g. 30">
                </div>
                <button
                    id="generate-sku"
                    class="generate-btn" py-click="generate_sku">
                    Generate SKU
                </button>
                <div class="output">
                    <div class="output-title">
                        Generated SKU:
                    </div>
                    <div id="sku-result"></div>
                    <div
                        id="sku-details"
                        class="details">
                    </div>
                </div>
            </div>
    </main>
    <footer>
        Franchesca Dela Rosa | 10 - Topaz  © 2026
    </footer>
    <py-script src="main.py"></py-script>
</body>
</html>
